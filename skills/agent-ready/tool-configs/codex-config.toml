# agent-ready guard for Codex: blocks secret-file reads and destructive commands.
# Merge this into .codex/config.toml at the project root.
# Codex only runs project hooks after you trust the project and approve the
# hook once with /hooks. Until then it is skipped without a warning.

[[hooks.PreToolUse]]
matcher = ".*"

[[hooks.PreToolUse.hooks]]
type = "command"
command = "node .agents/hooks/guard.mjs"
